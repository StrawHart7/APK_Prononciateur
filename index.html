<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#00d1b2" />
    <link rel="shortcut icon" href="assets/icon-192x192.png?v=2" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/4e67213ea6.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <title>Prononciateur Stylé</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h2><i class="fa-solid fa-headphones"></i> Straw Pronounce .</h2>

    <select id="languageSwitcher">
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>

    <p id="voiceStatus" style="font-size:13px; color:#aaa; margin-bottom:10px;"></p>

    <textarea id="textInput">This tool helps you improve your English pronunciation, word by word.</textarea>

    <div class="buttons">
      <button id="loadBtn" onclick="prepareText()">Load</button>
      <button id="playBtn" onclick="speak()"><i class="fa-solid fa-play"></i> Play</button>
      <button id="pauseBtn" onclick="togglePause()"><i class="fa-solid fa-pause"></i> Pause</button>
      <button id="stopBtn" onclick="stop()"><i class="fa-solid fa-stop"></i> Stop</button>
      <button id="clearBtn" onclick="clearText()"><i class="fa-solid fa-broom"></i> Clear</button>
    </div>

    <div class="speed-control">
      Vitesse : <span id="rateValue">1.0</span>x <br />
      <input type="range" id="rateSlider" min="0.5" max="2" value="1" step="0.1" onchange="updateRate()" />
    </div>

    <div id="scrollContainer">
      <div id="scrollText"></div>
    </div>

    <p id="status">Prêt à parler <i class="fa-solid fa-headphones"></i></p>

    <script src="translations.js"></script>
    <script src="script.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => {
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          });
      }
    </script>
  </body>
</html>
